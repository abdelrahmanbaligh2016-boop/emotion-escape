0
);



const antennaBall =
part(

new THREE.Mesh(

new THREE.SphereGeometry(
.13,
20,
20
),

cyanMaterial

),

"antennaBall"

);


antennaBall.position.set(
0,
2.64,
0
);



robotParts.forEach(
p => {

p.castShadow =
true;


p.userData.homePosition =
p.position.clone();


p.userData.homeRotation =
p.rotation.clone();

}
);



/* =========================================================
   CAMERA TARGETS
========================================================= */

let cameraTargetPosition =
new THREE.Vector3(
0,
2.4,
8
);


let cameraLookTarget =
new THREE.Vector3(
0,
.5,
-1
);



/* =========================================================
   ANIMATION STATES
========================================================= */

let emotion =
"normal";


let emotionStart =
0;


let exploded =
false;


let explosionParts =
[];


let doorOpening =
false;


let doorOpenAmount =
0;



/* =========================================================
   RESET ROBOT
========================================================= */

function resetRobot(){

exploded =
false;


explosionParts =
[];


emotion =
"normal";


robot.position.set(
0,
-.15,
1.2
);


robot.rotation.set(
0,
0,
0
);


robot.scale.set(
1,
1,
1
);


robotParts.forEach(
p => {

p.position.copy(
p.userData.homePosition
);


p.rotation.copy(
p.userData.homeRotation
);


p.visible =
true;

}
);


eyeL.scale.set(
1,
1.4,
1
);


eyeR.scale.set(
1,
1.4,
1
);


mouth.scale.set(
1,
1,
1
);


cyanLight.color.set(
0x22d3ee
);

}



/* =========================================================
   EMOTION ANIMATION
========================================================= */

function playEmotion(
type
){

resetRobot();


emotion =
type;


emotionStart =
performance.now();

}



function updateEmotion(
time
){

if(
emotion ===
"normal"
)
return;


const t =
(
time -
emotionStart
)
/1000;



if(
emotion ===
"happy"
){

robot.position.y =
-.15 +
Math.abs(
Math.sin(
t * 7
)
)
*
.55;


armL.rotation.z =
-.8;


armR.rotation.z =
.8;


robot.rotation.z =
Math.sin(
t * 8
)
*
.12;

}



if(
emotion ===
"angry"
){

robot.position.x =
Math.sin(
t * 35
)
*
.11;


robot.rotation.z =
Math.sin(
t * 32
)
*
.06;


cyanLight.color.set(
0xef4444
);


eyeL.rotation.z =
-.35;


eyeR.rotation.z =
.35;

}



if(
emotion ===
"afraid"
){

robot.position.x =
Math.sin(
t * 45
)
*
.07;


robot.position.y =
-.15 +
Math.sin(
t * 40
)
*
.04;


robot.scale.set(
.92,
.92,
.92
);

}



if(
emotion ===
"surprised"
){

const s =
1 +
Math.abs(
Math.sin(
t * 6
)
)
*
.2;


robot.scale.set(
s,
s,
s
);


eyeL.scale.set(
1.5,
1.9,
1.5
);


eyeR.scale.set(
1.5,
1.9,
1.5
);


mouth.scale.set(
.45,
2,
1
);

}



if(
emotion ===
"sad"
){

robot.position.y =
-.35;


head.rotation.z =
-.12;


armL.rotation.z =
.25;


armR.rotation.z =
-.25;


mouth.rotation.z =
Math.PI;

}



if(
emotion ===
"disgusted"
){

robot.rotation.z =
-.18;


head.rotation.y =
-.4;


cyanLight.color.set(
0x22c55e
);

}



if(
emotion ===
"calm"
){

robot.position.y =
-.15 +
Math.sin(
t * 2
)
*
.03;

}



if(
emotion ===
"proud"
){

robot.position.y =
-.05;


robot.rotation.y =
Math.sin(
t * 2
)
*
.15;


armL.rotation.z =
-.55;


armR.rotation.z =
.55;


robot.scale.set(
1.08,
1.08,
1.08
);

}

}



/* =========================================================
   ROBOT EXPLOSION
========================================================= */

function explodeRobot(){

resetRobot();


exploded =
true;


explosionParts =
[];


robotParts.forEach(
p => {

explosionParts.push({

part:p,

velocity:
new THREE.Vector3(

(
Math.random()
-
.5
)
*
.1,

Math.random()
*
.08
+
.03,

(
Math.random()
-
.5
)
*
.08

),

spin:
new THREE.Vector3(

Math.random()
*
.18,

Math.random()
*
.18,

Math.random()
*
.18

)

});

});

}



function updateExplosion(){

if(
!exploded
)
return;


explosionParts.forEach(
item => {

item.velocity.y -=
.003;


item.part.position.add(
item.velocity
);


item.part.rotation.x +=
item.spin.x;


item.part.rotation.y +=
item.spin.y;


item.part.rotation.z +=
item.spin.z;

});

}



/* =========================================================
   DOOR ANIMATION
========================================================= */

function resetDoor(){

doorOpening =
false;


doorOpenAmount =
0;


doorLeft.rotation.y =
0;


doorRight.rotation.y =
0;


doorLeft.position.x =
-.8;


doorRight.position.x =
.8;

}



function openDoor(){

doorOpening =
true;


doorOpenAmount =
0;

}



function updateDoor(){

if(
!doorOpening
)
return;


doorOpenAmount +=
.025;


doorLeft.rotation.y =
-Math.min(
doorOpenAmount,
1.35
);


doorRight.rotation.y =
Math.min(
doorOpenAmount,
1.35
);


doorLeft.position.x =
-.8 -
Math.min(
doorOpenAmount,
1
)
*
.45;


doorRight.position.x =
.8 +
Math.min(
doorOpenAmount,
1
)
*
.45;

}



/* =========================================================
   CAMERA WALK
========================================================= */

function walkForward(){

cameraTargetPosition.set(
0,
2.2,
4.8
);


setTimeout(
() => {

cameraTargetPosition.set(
0,
2.4,
8
);

},
900
);

}



/* =========================================================
   RENDER LOOP
========================================================= */

function resize(){

const box =
canvas.getBoundingClientRect();


renderer.setSize(
box.width,
box.height,
false
);


camera.aspect =
box.width /
box.height;


camera.updateProjectionMatrix();

}



function animate(
time
){

requestAnimationFrame(
animate
);


resize();


camera.position.lerp(
cameraTargetPosition,
.045
);


camera.lookAt(
cameraLookTarget
);


updateEmotion(
time
);


updateExplosion();


updateDoor();


renderer.render(
scene,
camera
);

}


requestAnimationFrame(
animate
);



/* =========================================================
   ANALYTICS
========================================================= */

function track(
event,
params={}
){

if(
typeof gtag ===
"function"
){

gtag(
"event",
event,
params
);

}

}



/* =========================================================
   GAME
========================================================= */

function startGame(){

currentLevel =
0;


currentDoor =
0;


score =
0;


lives =
3;


gameRunning =
true;


document
.getElementById(
"startScreen"
)
.classList
.add(
"hidden"
);


document
.getElementById(
"levelScreen"
)
.classList
.add(
"hidden"
);


document
.getElementById(
"endScreen"
)
.classList
.add(
"hidden"
);


document
.getElementById(
"questionPanel"
)
.classList
.remove(
"hidden"
);


track(
"game_start"
);


loadDoor();

}



function loadDoor(){

locked =
false;


resetRobot();


resetDoor();


cameraTargetPosition.set(
0,
2.4,
8
);


const item =
levels[
currentLevel
]
.questions[
currentDoor
];


document
.getElementById(
"levelLabel"
)
.textContent =
`Level ${currentLevel + 1}`;


document
.getElementById(
"doorLabel"
)
.textContent =
`Door ${currentDoor + 1}/5`;


document
.getElementById(
"scoreLabel"
)
.textContent =
`Score: ${score}`;


document
.getElementById(
"livesLabel"
)
.textContent =
"❤️".repeat(
lives
)
+
"🖤".repeat(
3-lives
);


document
.getElementById(
"question"
)
.textContent =
item.q;


document
.getElementById(
"feedback"
)
.textContent =
"";


const choiceBox =
document
.getElementById(
"choices"
);


choiceBox.innerHTML =
"";


item.answers.forEach(
(answer,index) => {

const button =
document.createElement(
"button"
);


button.textContent =
answer;


button.onclick =
() =>
answerQuestion(
index
);


choiceBox.appendChild(
button
);

});

}



function disableButtons(
state
){

document
.querySelectorAll(
"#choices button"
)
.forEach(
button => {

button.disabled =
state;

});

}



function answerQuestion(
index
){

if(
locked
)
return;


locked =
true;


disableButtons(
true
);


const item =
levels[
currentLevel
]
.questions[
currentDoor
];


const feedback =
document
.getElementById(
"feedback"
);



/* CORRECT */

if(
index ===
item.correct
){

score +=
100;


playEmotion(
item.emotion
);


feedback.textContent =
"✅ Correct! Door unlocked!";


track(
"door_complete",
{

level_number:
currentLevel + 1,

door_number:
currentDoor + 1,

emotion:
item.emotion

}
);


document
.getElementById(
"scoreLabel"
)
.textContent =
`Score: ${score}`;


setTimeout(
() => {

openDoor();

},
800
);


setTimeout(
() => {

walkForward();

},
1300
);


setTimeout(
() => {

currentDoor++;


if(
currentDoor >=
5
){

completeLevel();

}

else{

loadDoor();

}

},
2400
);

}



/* WRONG */

else
{

lives--;


feedback.textContent =
"💥 Wrong! Robo broke into pieces!";


document
.getElementById(
"livesLabel"
)
.textContent =
"❤️".repeat(
lives
)
+
"🖤".repeat(
3-lives
);


explodeRobot();


track(
"wrong_answer",
{

level_number:
currentLevel + 1,

door_number:
currentDoor + 1

}
);


if(
lives <=
0
){

setTimeout(
() => {

finishGame(
false
);

},
2000
);

}

else
{

setTimeout(
() => {

resetRobot();


feedback.textContent =
"🔧 Robo rebuilt himself. Try again!";


disableButtons(
false
);


locked =
false;

},
1900
);

}

}

}



/* =========================================================
   LEVEL COMPLETE
========================================================= */

function completeLevel(){

document
.getElementById(
"questionPanel"
)
.classList
.add(
"hidden"
);


if(
currentLevel ===
4
){

finishGame(
true
);


return;

}


document
.getElementById(
"levelScreen"
)
.classList
.remove(
"hidden"
);


document
.getElementById(
"levelTitle"
)
.textContent =
`Level ${currentLevel + 1} Complete!`;


document
.getElementById(
"levelMessage"
)
.innerHTML =
`
You unlocked all five doors in
<span class="level-name">
${levels[currentLevel].name}
</span>.
<br><br>
Now enter Level ${currentLevel + 2}.
`;


track(
"level_complete",
{

level_number:
currentLevel + 1

}
);

}



/* =========================================================
   NEXT LEVEL
========================================================= */

function nextLevel(){

currentLevel++;


currentDoor =
0;


document
.getElementById(
"levelScreen"
)
.classList
.add(
"hidden"
);


document
.getElementById(
"questionPanel"
)
.classList
.remove(
"hidden"
);


loadDoor();

}



/* =========================================================
   END GAME
========================================================= */

function finishGame(
win
){

document
.getElementById(
"questionPanel"
)
.classList
.add(
"hidden"
);


document
.getElementById(
"levelScreen"
)
.classList
.add(
"hidden"
);


document
.getElementById(
"endScreen"
)
.classList
.remove(
"hidden"
);


document
.getElementById(
"endIcon"
)
.textContent =
win
?
"🏆🤖🚪"
:
"💥🤖";


document
.getElementById(
"endTitle"
)
.textContent =
win
?
"Emotion Lab Escaped!"
:
"Game Over";


document
.getElementById(
"endMessage"
)
.textContent =
win

?

`You completed all five levels and unlocked all 25 doors! Final score: ${score}.`

:

`Robo ran out of lives at Level ${currentLevel + 1}, Door ${currentDoor + 1}. Final score: ${score}.`;


track(
"game_finish",
{

result:
win
?
"win"
:
"lose",

score:
score,

level:
currentLevel + 1

}
);

}


</script>

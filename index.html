<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:#020617;
    color:white;
}

.game{
    width:100%;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

header{
    min-height:70px;
    padding:14px 25px;

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;

    background:rgba(2,6,23,.96);

    border-bottom:1px solid #334155;

    z-index:20;
}

header h1{
    margin:0;
    font-size:25px;
}

.stats{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    font-weight:bold;
}

#gameArea{
    position:relative;
    flex:1;
    min-height:680px;
}

#gameCanvas{
    display:block;
    width:100%;
    height:100%;
}

.question-panel{
    position:absolute;

    left:50%;
    bottom:20px;

    transform:translateX(-50%);

    width:min(860px,94%);

    padding:18px;

    border-radius:22px;

    background:rgba(2,6,23,.91);

    border:1px solid rgba(148,163,184,.35);

    backdrop-filter:blur(12px);
}

.question-top{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;

    margin-bottom:12px;
}

.speak-button{
    width:auto;
    padding:10px 18px;
    background:#38bdf8;
}

.question{
    text-align:center;
    font-size:20px;
    line-height:1.45;
    margin-bottom:15px;
}

.choices{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:11px;
}

button,
select,
input{
    font:inherit;
}

button{
    border:0;
    border-radius:14px;
    padding:14px;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;
}

.answer-button{
    background:#e2e8f0;
    color:#020617;
}

button:hover{
    transform:translateY(-1px);
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.feedback{
    min-height:30px;
    margin-top:12px;

    text-align:center;
    font-size:17px;
    font-weight:bold;
}

.full-screen{
    position:absolute;
    inset:0;

    z-index:30;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:25px;

    text-align:center;

    background:
    radial-gradient(
        circle,
        rgba(30,58,138,.97),
        rgba(2,6,23,.995)
    );
}

.card{
    width:min(680px,96%);

    padding:32px;

    border-radius:28px;

    background:rgba(15,23,42,.95);

    border:1px solid #475569;
}

.big-icon{
    font-size:70px;
}

.card h2{
    margin:13px 0;
    font-size:35px;
}

.card p{
    color:#cbd5e1;
    line-height:1.5;
}

.setup-grid{
    margin:23px 0;

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;

    text-align:left;
}

.setup-item{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.setup-item label{
    font-weight:bold;
}

.setup-item select,
.setup-item input{
    width:100%;

    padding:13px;

    border:1px solid #64748b;
    border-radius:12px;

    background:#0f172a;
    color:white;

    outline:none;
}

.time-box{
    grid-column:1 / -1;

    padding:15px;

    border-radius:15px;

    background:#020617;

    text-align:center;

    font-size:21px;
    font-weight:bold;
}

.primary{
    background:#38bdf8;
    color:#020617;
}

.next{
    background:#22c55e;
    color:#020617;
}

.hidden{
    display:none !important;
}

.trophy-text{
    font-size:26px;
    font-weight:bold;
}

@media(max-width:700px){

    header{
        flex-direction:column;
        align-items:flex-start;
    }

    #gameArea{
        min-height:800px;
    }

    .choices{
        grid-template-columns:1fr;
    }

    .setup-grid{
        grid-template-columns:1fr;
    }

    .time-box{
        grid-column:auto;
    }

    .card{
        padding:22px;
    }
}

</style>
</head>

      for English and Arabic throughout the game.

/* =========================================================
   COUNTRY TIME
========================================================= */

const countrySelect =
document.getElementById("countrySelect");

function updateCountry(){

    const parts =
    countrySelect.value.split("|");

    selectedCountry = parts[0];
    selectedTimeZone = parts[1];

    updateClock();
}

function updateClock(){

    let time = "--:--";

    try{

        time =
        new Intl.DateTimeFormat(
            selectedLanguage === "ar"
            ? "ar-EG"
            : "en-US",
            {
                timeZone:selectedTimeZone,
                hour:"numeric",
                minute:"2-digit",
                second:"2-digit"
            }
        ).format(new Date());

    }catch(error){

        time = "--:--";
    }

    document.getElementById(
        "countryTime"
    ).textContent = time;

    document.getElementById(
        "countryTimeBox"
    ).childNodes[0].textContent =
    "🌍 " + selectedCountry + "  ";

    document.getElementById(
        "countryHeader"
    ).textContent =
    "🌍 " + selectedCountry;

    document.getElementById(
        "timeHeader"
    ).textContent =
    "⏰ " + time;
}

countrySelect.addEventListener(
    "change",
    updateCountry
);

setInterval(
    updateClock,
    1000
);


/* =========================================================
   TEXT TO SPEECH
========================================================= */

function speak(text){

    if(!("speechSynthesis" in window)){
        return;
    }

    speechSynthesis.cancel();

    const utterance =
    new SpeechSynthesisUtterance(text);

    utterance.lang =
    VOICE_LANGUAGE[selectedLanguage] ||
    "en-US";

    utterance.rate = .93;
    utterance.pitch = 1;

    const voices =
    speechSynthesis.getVoices();

    const matchingVoice =
    voices.find(
        voice =>
        voice.lang
        .toLowerCase()
        .startsWith(
            utterance.lang
            .substring(0,2)
            .toLowerCase()
        )
    );

    if(matchingVoice){
        utterance.voice = matchingVoice;
    }

    speechSynthesis.speak(
        utterance
    );
}

document.getElementById(
    "speakButton"
).addEventListener(
    "click",
    ()=>{
        speak(lastSpokenText);
    }
);


/* =========================================================
   LANGUAGE UPDATE
========================================================= */

function formatText(
    text,
    values={}
){

    let result = text;

    Object.keys(values).forEach(key=>{

        result =
        result.replaceAll(
            `{${key}}`,
            values[key]
        );

    });

    return result;
}


function applyLanguage(){

    selectedLanguage =
    document.getElementById(
        "languageSelect"
    ).value;

    const t =
    UI[selectedLanguage];

    document.documentElement.lang =
    selectedLanguage;

    document.documentElement.dir =
    selectedLanguage === "ar"
    ? "rtl"
    : "ltr";

    document.getElementById(
        "languageLabel"
    ).textContent =
    t.language;

    document.getElementById(
        "countryLabel"
    ).textContent =
    t.country;

    document.getElementById(
        "nameLabel"
    ).textContent =
    t.name;

    document.getElementById(
        "startButton"
    ).textContent =
    t.start;

    document.getElementById(
        "startDescription"
    ).textContent =
    t.startDescription;

    document.getElementById(
        "speakButton"
    ).textContent =
    t.speak;

    document.getElementById(
        "nextLevelButton"
    ).textContent =
    t.next;

    document.getElementById(
        "playAgainButton"
    ).textContent =
    t.again;

    updateClock();

    if(
        !document
        .getElementById(
            "questionPanel"
        )
        .classList
        .contains("hidden")
    ){
        loadDoor(false);
    }
}


document.getElementById(
    "languageSelect"
).addEventListener(
    "change",
    applyLanguage
);

/* =========================================================
   ANIMATION STATE
========================================================= */

let emotion =
"normal";

let emotionStart =
0;

let exploded =
false;

let explosionParts =
[];

let doorOpening =
false;

let doorOpenAmount =
0;

let robotTurning =
false;

let turnProgress =
0;

let robotWalking =
false;

let walkProgress =
0;

let cameraFollowing =
false;

let finalVictoryRun =
false;


/* =========================================================
   RESET ROBOT
========================================================= */

function resetRobot(){

    exploded = false;

    explosionParts = [];

    emotion =
    "normal";

    robotTurning =
    false;

    turnProgress =
    0;

    robotWalking =
    false;

    walkProgress =
    0;

    cameraFollowing =
    false;

    finalVictoryRun =
    false;

    robot.position.set(
        0,
        -.15,
        1.2
    );

    robot.rotation.set(
        0,
        0,
        0
    );

    robot.scale.set(
        1,
        1,
        1
    );

    robotParts.forEach(
        part=>{

            part.position.copy(
                part.userData.homePosition
            );

            part.rotation.copy(
                part.userData.homeRotation
            );

            part.scale.copy(
                part.userData.homeScale
            );

        }
    );

    cyanLight.color.set(
        0x22d3ee
    );

    trophy.visible =
    false;
}


/* =========================================================
   EMOTIONS
========================================================= */

function playEmotion(
    type
){

    resetRobot();

    emotion =
    type;

    emotionStart =
    performance.now();
}


function updateEmotion(
    time
){

    if(
        emotion ===
        "normal"
    ){
        return;
    }

    if(
        robotWalking ||
        robotTurning
    ){
        return;
    }

    const t =
    (
        time -
        emotionStart
    ) / 1000;


    if(
        emotion ===
        "happy"
    ){

        robot.position.y =
        -.15 +
        Math.abs(
            Math.sin(
                t*7
            )
        )*.5;

        armL.rotation.z =
        -.8;

        armR.rotation.z =
        .8;
    }


    if(
        emotion ===
        "angry"
    ){

        robot.position.x =
        Math.sin(
            t*35
        )*.1;

        robot.rotation.z =
        Math.sin(
            t*30
        )*.05;

        cyanLight.color.set(
            0xef4444
        );
    }


    if(
        emotion ===
        "afraid"
    ){

        robot.position.x =
        Math.sin(
            t*45
        )*.07;
    }


    if(
        emotion ===
        "surprised"
    ){

        const scale =
        1 +
        Math.abs(
            Math.sin(
                t*6
            )
        )*.18;

        robot.scale.set(
            scale,
            scale,
            scale
        );

        eyeL.scale.set(
            1.5,
            1.9,
            1.5
        );

        eyeR.scale.set(
            1.5,
            1.9,
            1.5
        );
    }


    if(
        emotion ===
        "sad"
    ){

        robot.position.y =
        -.35;

        head.rotation.z =
        -.12;

        armL.rotation.z =
        .25;

        armR.rotation.z =
        -.25;
    }


    if(
        emotion ===
        "disgusted"
    ){

        robot.rotation.z =
        -.18;

        head.rotation.y =
        -.4;

        cyanLight.color.set(
            0x22c55e
        );
    }


    if(
        emotion ===
        "calm"
    ){

        robot.position.y =
        -.15 +
        Math.sin(
            t*2
        )*.03;
    }


    if(
        emotion ===
        "proud"
    ){

        armL.rotation.z =
        -.55;

        armR.rotation.z =
        .55;
    }
}


/* =========================================================
   WRONG ANSWER EXPLOSION
========================================================= */

function explodeRobot(){

    resetRobot();

    exploded =
    true;

    explosionParts =
    [];

    robotParts.forEach(
        part=>{

            explosionParts.push({

                part,

                velocity:
                new THREE.Vector3(
                    (Math.random()-.5)*.1,
                    Math.random()*.08+.03,
                    (Math.random()-.5)*.08
                ),

                spin:
                new THREE.Vector3(
                    Math.random()*.18,
                    Math.random()*.18,
                    Math.random()*.18
                )

            });

        }
    );
}


function updateExplosion(){

    if(!exploded){
        return;
    }

    explosionParts.forEach(
        item=>{

            item.velocity.y -=
            .003;

            item.part.position.add(
                item.velocity
            );

            item.part.rotation.x +=
            item.spin.x;

            item.part.rotation.y +=
            item.spin.y;

            item.part.rotation.z +=
            item.spin.z;

        }
    );
}


/* =========================================================
   DOOR
========================================================= */

function resetDoor(){

    doorOpening =
    false;

    doorOpenAmount =
    0;

    leftDoorPivot.rotation.y =
    0;

    rightDoorPivot.rotation.y =
    0;
}


function openDoor(){

    doorOpening =
    true;
}


function updateDoor(){

    if(
        !doorOpening
    ){
        return;
    }

    doorOpenAmount +=
    .038;

    doorOpenAmount =
    Math.min(
        doorOpenAmount,
        1
    );

    leftDoorPivot.rotation.y =
    -doorOpenAmount *
    Math.PI/2;

    rightDoorPivot.rotation.y =
    doorOpenAmount *
    Math.PI/2;
}


/* =========================================================
   CORRECT ANSWER TRANSITION
========================================================= */

function beginCorrectTransition(
    emotionType
){

    playEmotion(
        emotionType
    );

    openDoor();

    robotTurning =
    true;

    turnProgress =
    0;

    cameraFollowing =
    true;
}


function updateRobotTurn(){

    if(
        !robotTurning
    ){
        return;
    }

    turnProgress +=
    .04;

    turnProgress =
    Math.min(
        turnProgress,
        1
    );

    robot.rotation.y =
    THREE.MathUtils.lerp(
        0,
        Math.PI,
        turnProgress
    );

    if(
        turnProgress >=
        1
    ){

        robot.rotation.y =
        Math.PI;

        robotTurning =
        false;

        robotWalking =
        true;

        walkProgress =
        0;
    }
}


/* =========================================================
   WALK THROUGH DOOR
========================================================= */

function updateRobotWalk(){

    if(
        !robotWalking
    ){
        return;
    }

    walkProgress +=
    finalVictoryRun
    ? .021
    : .015;

    robot.position.z =
    1.2 -
    walkProgress*8;

    robot.position.y =
    -.15 +
    Math.abs(
        Math.sin(
            walkProgress *
            (
                finalVictoryRun
                ? 45
                : 34
            )
        )
    )*.1;


    armL.rotation.x =
    Math.sin(
        walkProgress*34
    )*.45;

    armR.rotation.x =
    -Math.sin(
        walkProgress*34
    )*.45;


    legL.rotation.x =
    -Math.sin(
        walkProgress*
        (
            finalVictoryRun
            ? 45
            : 34
        )
    )*.45;

    legR.rotation.x =
    Math.sin(
        walkProgress*
        (
            finalVictoryRun
            ? 45
            : 34
        )
    )*.45;


    /*
       Keep arms closer to trophy
       during final victory run
    */

    if(
        finalVictoryRun
    ){

        armL.rotation.z =
        -.42;

        armR.rotation.z =
        .42;
    }


    if(
        walkProgress >=
        1
    ){

        robotWalking =
        false;

        cameraFollowing =
        false;


        if(
            finalVictoryRun
        ){

            showVictoryScreen();

        }else{

            finishDoorTransition();
        }
    }
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

    if(
        cameraFollowing
    ){

        const follow =
        new THREE.Vector3(
            robot.position.x,
            robot.position.y+2.2,
            robot.position.z+4
        );

        camera.position.lerp(
            follow,
            .1
        );

        camera.lookAt(
            robot.position.x,
            robot.position.y+.8,
            robot.position.z-2
        );

    }else{

        camera.position.lerp(
            normalCameraPosition,
            .06
        );

        camera.lookAt(
            0,
            .5,
            -1
        );
    }
}


/* =========================================================
   FINAL TROPHY RUN
========================================================= */

function startFinalVictory(){

    victoryMode =
    true;

    document.getElementById(
        "questionPanel"
    ).classList.add(
        "hidden"
    );

    trophy.visible =
    true;

    emotion =
    "normal";

    /*
      Robo holds trophy
    */

    armL.rotation.z =
    -.42;

    armR.rotation.z =
    .42;

    armL.rotation.x =
    -.15;

    armR.rotation.x =
    -.15;


    openDoor();

    robotTurning =
    true;

    turnProgress =
    0;

    cameraFollowing =
    true;

    finalVictoryRun =
    true;
}


/*
   When turning finishes,
   normal walk code automatically starts.
   finalVictoryRun makes it a faster run.
*/


function showVictoryScreen(){

    const t =
    UI[selectedLanguage];

    document.getElementById(
        "endScreen"
    ).classList.remove(
        "hidden"
    );

    document.getElementById(
        "endIcon"
    ).textContent =
    "🏆🤖🎉";

    document.getElementById(
        "endTitle"
    ).textContent =
    formatText(
        t.win,
        {
            name:robotName
        }
    );

    document.getElementById(
        "endMessage"
    ).textContent =
    formatText(
        t.winMessage,
        {
            name:robotName,
            score:score
        }
    );

    speak(
        formatText(
            t.win,
            {
                name:robotName
            }
        )
    );

    track(
        "game_finish",
        {
            result:"win",
            score:score,
            country:selectedCountry,
            language:selectedLanguage
        }
    );
}


/* =========================================================
   CANVAS RESIZE
========================================================= */

function resize(){

    const box =
    canvas.getBoundingClientRect();

    renderer.setSize(
        box.width,
        box.height,
        false
    );

    camera.aspect =
    box.width /
    box.height;

    camera.updateProjectionMatrix();
}


/* =========================================================
   MAIN LOOP
========================================================= */

function animate(
    time
){

    requestAnimationFrame(
        animate
    );

    resize();

    updateEmotion(
        time
    );

    updateExplosion();

    updateDoor();

    updateRobotTurn();

    updateRobotWalk();

    updateCamera();

    renderer.render(
        scene,
        camera
    );
}

requestAnimationFrame(
    animate
);


/* =========================================================
   ANALYTICS
========================================================= */

function track(
    name,
    params={}
){

    if(
        typeof gtag ===
        "function"
    ){

        gtag(
            "event",
            name,
            params
        );
    }
}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    selectedLanguage =
    document.getElementById(
        "languageSelect"
    ).value;

    const enteredName =
    document.getElementById(
        "robotNameInput"
    ).value.trim();

    robotName =
    enteredName ||
    "Robo";

    currentLevel =
    0;

    currentDoor =
    0;

    score =
    0;

    lives =
    3;

    victoryMode =
    false;

    document.getElementById(
        "startScreen"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "endScreen"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "levelScreen"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "questionPanel"
    ).classList.remove(
        "hidden"
    );

    track(
        "game_start",
        {
            language:selectedLanguage,
            country:selectedCountry,
            robot_name:robotName
        }
    );

    loadDoor(
        true
    );
}


/* =========================================================
   LOAD QUESTION
========================================================= */

function getQuestionIndex(){

    return (
        currentLevel *
        5
    ) +
    currentDoor;
}


function loadDoor(
    autoSpeak=true
){

    locked =
    false;

    resetRobot();

    resetDoor();

    camera.position.copy(
        normalCameraPosition
    );

    const t =
    UI[selectedLanguage];

    const item =
    questions[
        getQuestionIndex()
    ];

    const data =
    getQuestionData(
        item
    );

    const questionText =
    data[0];

    const answers =
    data[1];


    document.getElementById(
        "levelLabel"
    ).textContent =
    `${t.level} ${currentLevel+1}`;

    document.getElementById(
        "doorLabel"
    ).textContent =
    `${t.door} ${currentDoor+1}/5`;

    document.getElementById(
        "scoreLabel"
    ).textContent =
    `${t.score}: ${score}`;

    document.getElementById(
        "livesLabel"
    ).textContent =
    "❤️".repeat(
        lives
    ) +
    "🖤".repeat(
        3-lives
    );

    document.getElementById(
        "question"
    ).textContent =
    questionText;

    document.getElementById(
        "feedback"
    ).textContent =
    "";

    const choices =
    document.getElementById(
        "choices"
    );

    choices.innerHTML =
    "";


    answers.forEach(
        (
            answer,
            index
        )=>{

            const button =
            document.createElement(
                "button"
            );

            button.className =
            "answer-button";

            button.textContent =
            answer;

            button.addEventListener(
                "click",
                ()=>{
                    answerQuestion(
                        index
                    );
                }
            );

            choices.appendChild(
                button
            );
        }
    );


    lastSpokenText =
    questionText;


    if(
        autoSpeak
    ){

        /*
           Browser TTS usually requires
           the player to press Start once first.
           After that questions can be spoken.
        */

        setTimeout(
            ()=>{
                speak(
                    questionText
                );
            },
            150
        );
    }
}


/* =========================================================
   ANSWERS
========================================================= */

function disableAnswerButtons(
    state
){

    document
    .querySelectorAll(
        "#choices button"
    )
    .forEach(
        button=>{

            button.disabled =
            state;

        }
    );
}


function answerQuestion(
    index
){

    if(
        locked
    ){
        return;
    }

    locked =
    true;

    disableAnswerButtons(
        true
    );


    const t =
    UI[selectedLanguage];

    const item =
    questions[
        getQuestionIndex()
    ];


    /*
       Correct answer is position 0.
    */

    if(
        index ===
        0
    ){

        score +=
        100;

        document.getElementById(
            "scoreLabel"
        ).textContent =
        `${t.score}: ${score}`;

        document.getElementById(
            "feedback"
        ).textContent =
        t.correct;


        track(
            "door_complete",
            {
                level_number:
                currentLevel+1,

                door_number:
                currentDoor+1,

                emotion:
                item.emotion
            }
        );


        /*
          FINAL DOOR:
          emotion -> trophy -> run out
        */

        if(
            currentLevel === 4 &&
            currentDoor === 4
        ){

            playEmotion(
                "happy"
            );

            /*
               Short emotion animation is handled
               in the same continuous sequence,
               without the old 700/1300ms door pause.
            */

            requestAnimationFrame(
                ()=>{
                    startFinalVictory();
                }
            );

            return;
        }


        /*
           NORMAL DOOR:
           door and Robo movement begin together.
           NO ARTIFICIAL SHORT PAUSE.
        */

        beginCorrectTransition(
            item.emotion
        );

    }else{

        lives--;

        document.getElementById(
            "feedback"
        ).textContent =
        formatText(
            t.wrong,
            {
                name:robotName
            }
        );

        document.getElementById(
            "livesLabel"
        ).textContent =
        "❤️".repeat(
            lives
        ) +
        "🖤".repeat(
            3-lives
        );


        explodeRobot();


        track(
            "wrong_answer",
            {
                level_number:
                currentLevel+1,

                door_number:
                currentDoor+1
            }
        );


        if(
            lives <=
            0
        ){

            setTimeout(
                ()=>{
                    finishGame(
                        false
                    );
                },
                1600
            );

        }else{

            setTimeout(
                ()=>{

                    resetRobot();

                    document.getElementById(
                        "feedback"
                    ).textContent =
                    formatText(
                        t.rebuilt,
                        {
                            name:
                            robotName
                        }
                    );

                    disableAnswerButtons(
                        false
                    );

                    locked =
                    false;

                },
                1500
            );
        }
    }
}


/* =========================================================
   NEXT DOOR
========================================================= */

function finishDoorTransition(){

    currentDoor++;

    if(
        currentDoor >=
        5
    ){

        completeLevel();

    }else{

        loadDoor(
            true
        );
    }
}


/* =========================================================
   LEVEL COMPLETE
========================================================= */

function completeLevel(){

    document.getElementById(
        "questionPanel"
    ).classList.add(
        "hidden"
    );

    const t =
    UI[selectedLanguage];


    if(
        currentLevel >=
        4
    ){

        startFinalVictory();
        return;
    }


    document.getElementById(
        "levelScreen"
    ).classList.remove(
        "hidden"
    );

    document.getElementById(
        "levelTitle"
    ).textContent =
    formatText(
        t.levelComplete,
        {
            level:
            currentLevel+1
        }
    );

    document.getElementById(
        "levelMessage"
    ).textContent =
    formatText(
        t.levelMessage,
        {
            name:
            robotName,

            next:
            currentLevel+2
        }
    );


    speak(
        document.getElementById(
            "levelMessage"
        ).textContent
    );


    track(
        "level_complete",
        {
            level_number:
            currentLevel+1
        }
    );
}


/* =========================================================
   NEXT LEVEL
========================================================= */

function nextLevel(){

    currentLevel++;

    currentDoor =
    0;

    document.getElementById(
        "levelScreen"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "questionPanel"
    ).classList.remove(
        "hidden"
    );

    loadDoor(
        true
    );
}


/* =========================================================
   GAME OVER
========================================================= */

function finishGame(
    win
){

    document.getElementById(
        "questionPanel"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "levelScreen"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "endScreen"
    ).classList.remove(
        "hidden"
    );

    const t =
    UI[selectedLanguage];


    if(
        win
    ){

        showVictoryScreen();

        return;
    }


    document.getElementById(
        "endIcon"
    ).textContent =
    "💥🤖";

    document.getElementById(
        "endTitle"
    ).textContent =
    t.gameOver;

    document.getElementById(
        "endMessage"
    ).textContent =
    formatText(
        t.loseMessage,
        {
            name:robotName,
            score:score
        }
    );


    track(
        "game_finish",
        {
            result:"lose",
            score:score
        }
    );
}


/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "startButton"
).addEventListener(
    "click",
    startGame
);


document.getElementById(
    "nextLevelButton"
).addEventListener(
    "click",
    nextLevel
);


document.getElementById(
    "playAgainButton"
).addEventListener(
    "click",
    ()=>{

        document.getElementById(
            "endScreen"
        ).classList.add(
            "hidden"
        );

        document.getElementById(
            "startScreen"
        ).classList.remove(
            "hidden"
        );

        resetRobot();
        resetDoor();

        camera.position.copy(
            normalCameraPosition
        );

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

applyLanguage();

updateCountry();

</script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:#020617;
    color:white;
}

.game{
    width:100%;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

header{
    min-height:70px;
    padding:15px 28px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    background:rgba(2,6,23,.96);
    border-bottom:1px solid #334155;
    z-index:20;
}

h1{
    margin:0;
    font-size:25px;
}

.stats{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    font-weight:bold;
}

#gameArea{
    position:relative;
    flex:1;
    min-height:680px;
}

#gameCanvas{
    width:100%;
    height:100%;
    display:block;
}

.question-panel{
    position:absolute;
    left:50%;
    bottom:22px;
    transform:translateX(-50%);
    width:min(850px,92%);
    padding:19px;
    border-radius:22px;
    background:rgba(2,6,23,.9);
    backdrop-filter:blur(12px);
    border:1px solid rgba(148,163,184,.35);
}

.question{
    text-align:center;
    font-size:20px;
    line-height:1.4;
    margin-bottom:15px;
}

.choices{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

button{
    border:0;
    border-radius:14px;
    padding:15px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    color:#020617;
    background:#e2e8f0;
}

button:hover{
    transform:translateY(-2px);
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.feedback{
    min-height:28px;
    margin-top:12px;
    text-align:center;
    font-size:17px;
    font-weight:bold;
}

.full-screen{
    position:absolute;
    inset:0;
    z-index:30;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
    text-align:center;
    background:
    radial-gradient(
        circle,
        rgba(30,58,138,.97),
        rgba(2,6,23,.99)
    );
}

.card{
    width:min(650px,95%);
    padding:36px;
    border-radius:28px;
    background:rgba(15,23,42,.94);
    border:1px solid #475569;
}

.card .icon{
    font-size:75px;
}

.card h2{
    margin:15px 0 8px;
    font-size:36px;
}

.card p{
    color:#cbd5e1;
    font-size:19px;
    line-height:1.5;
}

.primary{background:#38bdf8}
.next{background:#22c55e}
.hidden{display:none!important}

@media(max-width:700px){
    header{
        flex-direction:column;
        align-items:flex-start;
    }

    #gameArea{
        min-height:760px;
    }

    .choices{
        grid-template-columns:1fr;
    }

    .question{
        font-size:18px;
    }
}
</style>

let currentLevel = 0;
let currentDoor = 0;
let score = 0;
let lives = 3;
let locked = false;

const canvas = document.getElementById("gameCanvas");

const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias:true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07111f);
scene.fog = new THREE.Fog(0x07111f,12,35);

const camera = new THREE.PerspectiveCamera(52,1,.1,100);
camera.position.set(0,2.5,8);

const ambient = new THREE.AmbientLight(0xffffff,1);
scene.add(ambient);

const mainLight = new THREE.DirectionalLight(0xffffff,2);
mainLight.position.set(4,9,5);
scene.add(mainLight);

const cyanLight = new THREE.PointLight(0x22d3ee,24,15);
cyanLight.position.set(-4,3,2);
scene.add(cyanLight);

const purpleLight = new THREE.PointLight(0x6366f1,18,15);
purpleLight.position.set(4,3,2);
scene.add(purpleLight);

const whiteMaterial = new THREE.MeshStandardMaterial({
    color:0xf8fafc,
    metalness:.55,

});

const darkMaterial = new THREE.MeshStandardMaterial({

});

});

const cyanMaterial = new THREE.MeshStandardMaterial({
    color:0x22d3ee,
    emissive:0x22d3ee,
    emissiveIntensity:2.5
});

const wallMaterial = new THREE.MeshStandardMaterial({
    color:0x111827,
    metalness:.25,
    roughness:.65
});

const floorMaterial = new THREE.MeshStandardMaterial({
    color:0x172033,
    metalness:.5,
    roughness:.4
});

const doorMaterial = new THREE.MeshStandardMaterial({
    color:0x1d4ed8,
    metalness:.7,
    roughness:.25
});

const glowMaterial = new THREE.MeshStandardMaterial({
    color:0x38bdf8,
    emissive:0x38bdf8,
    emissiveIntensity:2
});

    new THREE.BoxGeometry(12,.25,25),

);
floor.position.set(0,-1.55,-5);
scene.add(floor);

    wallMaterial
);
leftWall.position.set(-6,2,-5);
scene.add(leftWall);

const rightWall = leftWall.clone();
rightWall.position.x = 6;
scene.add(rightWall);

const ceiling = new THREE.Mesh(
    new THREE.BoxGeometry(12,.2,25),

);
ceiling.position.set(0,5.4,-5);

    new THREE.BoxGeometry(12,7,.3),
    wallMaterial
);
backWall.position.set(0,2,-14);
scene.add(backWall);

for(let z=5; z>-14; z-=2.5){

    const strip1 = new THREE.Mesh(

        glowMaterial
    );

    strip1.position.set(-4.3,-1.4,z);
    scene.add(strip1);

    const strip2 = strip1.clone();
    strip2.position.x = 4.3;
    scene.add(strip2);
}

doorGroup.position.set(0,.55,-4);
scene.add(doorGroup);

);
frameLeft.position.x = -1.7;

const frameRight = frameLeft.clone();
frameRight.position.x = 1.7;
doorGroup.add(frameRight);

const frameTop = new THREE.Mesh(

    metalMaterial
);
frameTop.position.y = 2.1;
doorGroup.add(frameTop);

const leftDoorPivot = new THREE.Group();
leftDoorPivot.position.set(-1.6,0,0);
doorGroup.add(leftDoorPivot);

const doorLeft = new THREE.Mesh(
    new THREE.BoxGeometry(1.55,3.85,.3),
    doorMaterial
);
doorLeft.position.x = .775;
leftDoorPivot.add(doorLeft);

rightDoorPivot.position.set(1.6,0,0);
doorGroup.add(rightDoorPivot);

    new THREE.BoxGeometry(1.55,3.85,.3),
    doorMaterial

doorRight.position.x = -.775;
rightDoorPivot.add(doorRight);

const robot = new THREE.Group();
robot.position.set(0,-.15,1.2);
scene.add(robot);

const robotParts = [];

function addRobotPart(mesh,name){
    mesh.userData.name = name;
    robot.add(mesh);
    robotParts.push(mesh);
    return mesh;
}

);
body.position.y = 0;

head.position.y = 1.48;

face.position.set(0,1.48,.54);

eyeL.scale.y = 1.4;

armL.position.set(-1,0,0);

antennaBall.position.set(0,2.64,0);

robotParts.forEach(part=>{
    part.userData.homePosition = part.position.clone();
    part.userData.homeRotation = part.rotation.clone();
});

let emotion = "normal";
let emotionStart = 0;

let exploded = false;
let explosionParts = [];

let doorOpening = false;
let doorOpenAmount = 0;

let robotTurning = false;
let turnProgress = 0;

let robotWalking = false;
let walkProgress = 0;

let cameraFollowing = false;

function resetRobot(){

    exploded = false;
    explosionParts = [];

    emotion = "normal";

    robotTurning = false;
    turnProgress = 0;

    robotWalking = false;
    walkProgress = 0;

    cameraFollowing = false;

    robot.position.set(0,-.15,1.2);
    robot.rotation.set(0,0,0);
    robot.scale.set(1,1,1);

    robotParts.forEach(part=>{
        part.position.copy(part.userData.homePosition);
        part.rotation.copy(part.userData.homeRotation);
    });

    eyeL.scale.set(1,1.4,1);
    eyeR.scale.set(1,1.4,1);
    mouth.scale.set(1,1,1);

    cyanLight.color.set(0x22d3ee);
}

function playEmotion(type){
    resetRobot();
    emotion = type;
    emotionStart = performance.now();
}

function updateEmotion(time){

    if(emotion==="normal") return;
    if(robotTurning || robotWalking) return;

    const t = (time-emotionStart)/1000;

    if(emotion==="happy"){
        robot.position.y =
        -.15 + Math.abs(Math.sin(t*7))*.5;

        armL.rotation.z = -.8;
        armR.rotation.z = .8;
    }

    if(emotion==="angry"){
        robot.position.x = Math.sin(t*35)*.1;
        robot.rotation.z = Math.sin(t*30)*.05;
        cyanLight.color.set(0xef4444);
    }

    if(emotion==="afraid"){
        robot.position.x = Math.sin(t*45)*.07;
        robot.position.y =
        -.15 + Math.sin(t*40)*.04;
    }

    if(emotion==="surprised"){
        const s =
        1 + Math.abs(Math.sin(t*6))*.2;

        robot.scale.set(s,s,s);

        eyeL.scale.set(1.5,1.9,1.5);
        eyeR.scale.set(1.5,1.9,1.5);
    }

    if(emotion==="sad"){
        robot.position.y = -.35;
        head.rotation.z = -.12;
        armL.rotation.z = .25;
        armR.rotation.z = -.25;
    }

    if(emotion==="disgusted"){
        robot.rotation.z = -.18;
        head.rotation.y = -.4;
        cyanLight.color.set(0x22c55e);
    }

    if(emotion==="calm"){
        robot.position.y =
        -.15 + Math.sin(t*2)*.03;
    }

    if(emotion==="proud"){
        armL.rotation.z = -.55;
        armR.rotation.z = .55;
        robot.scale.set(1.08,1.08,1.08);
    }
}

function explodeRobot(){

    resetRobot();

    exploded = true;
    explosionParts = [];

    robotParts.forEach(part=>{

        explosionParts.push({
            part,
            velocity:new THREE.Vector3(
                (Math.random()-.5)*.1,
                Math.random()*.08+.03,
                (Math.random()-.5)*.08
            ),
            spin:new THREE.Vector3(
                Math.random()*.18,
                Math.random()*.18,
                Math.random()*.18
            )
        });

    });
}

function updateExplosion(){

    if(!exploded) return;

    explosionParts.forEach(item=>{

        item.velocity.y -= .003;

        item.part.position.add(
            item.velocity
        );

        item.part.rotation.x += item.spin.x;
        item.part.rotation.y += item.spin.y;
        item.part.rotation.z += item.spin.z;
    });
}

function resetDoor(){

    doorOpening = false;
    doorOpenAmount = 0;

    leftDoorPivot.rotation.y = 0;
    rightDoorPivot.rotation.y = 0;
}

function openDoor(){
    doorOpening = true;
}

function updateDoor(){

    if(!doorOpening) return;

    doorOpenAmount += .035;

    doorOpenAmount =
    Math.min(doorOpenAmount,1);

    leftDoorPivot.rotation.y =
    -doorOpenAmount * Math.PI/2;

    rightDoorPivot.rotation.y =
    doorOpenAmount * Math.PI/2;
}

function beginCorrectTransition(emotionType){

    playEmotion(emotionType);

    openDoor();

    robotTurning = true;
    turnProgress = 0;

    cameraFollowing = true;
}

function updateRobotTurn(){

    if(!robotTurning) return;

    turnProgress += .035;
    turnProgress = Math.min(turnProgress,1);

    robot.rotation.y =
    THREE.MathUtils.lerp(
        0,
        Math.PI,
        turnProgress
    );

    if(turnProgress >= 1){

        robot.rotation.y = Math.PI;

        robotTurning = false;

        robotWalking = true;
        walkProgress = 0;
    }
}

function updateRobotWalk(){

    if(!robotWalking) return;

    walkProgress += .014;

    robot.position.z =
    1.2 - walkProgress*8;

    robot.position.y =
    -.15 +
    Math.abs(
        Math.sin(
            walkProgress*34
        )
    )*.1;

    armL.rotation.x =
    Math.sin(
        walkProgress*34
    )*.5;

    armR.rotation.x =
    -Math.sin(
        walkProgress*34
    )*.5;

    legL.rotation.x =
    -Math.sin(
        walkProgress*34
    )*.4;

    legR.rotation.x =
    Math.sin(
        walkProgress*34
    )*.4;

    if(walkProgress >= 1){

        robotWalking = false;
        cameraFollowing = false;

        finishDoorTransition();
    }
}

const normalCameraPosition =
new THREE.Vector3(0,2.5,8);

function updateCamera(){

    if(cameraFollowing){

        const followPosition =
        new THREE.Vector3(
            robot.position.x,
            robot.position.y+2.2,
            robot.position.z+4
        );

        camera.position.lerp(
            followPosition,
            .1
        );

        camera.lookAt(
            robot.position.x,
            robot.position.y+.8,
            robot.position.z-2
        );

    }else{

        camera.position.lerp(
            normalCameraPosition,
            .06
        );

        camera.lookAt(
            0,
            .5,
            -1
        );
    }
}

function resize(){

    const box =
    canvas.getBoundingClientRect();

    renderer.setSize(
        box.width,
        box.height,
        false
    );

    camera.aspect =
    box.width/box.height;

    camera.updateProjectionMatrix();
}

function animate(time){

    requestAnimationFrame(animate);

    resize();

    updateEmotion(time);
    updateExplosion();
    updateDoor();
    updateRobotTurn();
    updateRobotWalk();
    updateCamera();

    renderer.render(scene,camera);
}

requestAnimationFrame(animate);

function track(name,params={}){

    if(typeof gtag==="function"){
        gtag("event",name,params);
    }
}

function startGame(){

    currentLevel = 0;
    currentDoor = 0;
    score = 0;
    lives = 3;

    document
    .getElementById("startScreen")
    .classList.add("hidden");

    document
    .getElementById("levelScreen")
    .classList.add("hidden");

    document
    .getElementById("endScreen")
    .classList.add("hidden");

    document
    .getElementById("questionPanel")
    .classList.remove("hidden");

    track("game_start");

    loadDoor();
}

function loadDoor(){

    locked = false;

    resetRobot();
    resetDoor();

    camera.position.copy(
        normalCameraPosition
    );

    const item =
    levels[currentLevel]
    .questions[currentDoor];

    document
    .getElementById("levelLabel")
    .textContent =
    `Level ${currentLevel+1}`;

    document
    .getElementById("doorLabel")
    .textContent =
    `Door ${currentDoor+1}/5`;

    document
    .getElementById("scoreLabel")
    .textContent =
    `Score: ${score}`;

    document
    .getElementById("livesLabel")
    .textContent =
    "❤️".repeat(lives) +
    "🖤".repeat(3-lives);

    document
    .getElementById("question")
    .textContent =
    item.q;

    document
    .getElementById("feedback")
    .textContent =
    "";

    const choices =
    document.getElementById("choices");

    choices.innerHTML = "";

    item.answers.forEach(
        (answer,index)=>{

            const button =
            document.createElement("button");

            button.textContent =
            answer;

            button.onclick =
            ()=>answerQuestion(index);

            choices.appendChild(button);
        }
    );
}

function disableButtons(state){

    document
    .querySelectorAll("#choices button")
    .forEach(button=>{
        button.disabled = state;
    });
}

function answerQuestion(index){

    if(locked) return;

    locked = true;
    disableButtons(true);

    const item =
    levels[currentLevel]
    .questions[currentDoor];

    const feedback =
    document.getElementById("feedback");

    if(index === item.correct){

        score += 100;

        document
        .getElementById("scoreLabel")
        .textContent =
        `Score: ${score}`;

        feedback.textContent =
        "✅ Correct!";

        beginCorrectTransition(
            item.emotion
        );

        track(
            "door_complete",
            {
                level_number:currentLevel+1,
                door_number:currentDoor+1,
                emotion:item.emotion
            }
        );

    }else{

        lives--;

        feedback.textContent =
        "💥 Wrong! Robo broke into pieces!";

        document
        .getElementById("livesLabel")
        .textContent =
        "❤️".repeat(lives) +
        "🖤".repeat(3-lives);

        explodeRobot();

        track(
            "wrong_answer",
            {
                level_number:currentLevel+1,
                door_number:currentDoor+1
            }
        );

        if(lives <= 0){

            setTimeout(
                ()=>finishGame(false),
                1800
            );

        }else{

            setTimeout(
                ()=>{

                    resetRobot();

                    feedback.textContent =
                    "🔧 Robo rebuilt himself. Try again!";

                    disableButtons(false);
                    locked = false;

                },
                1700
            );
        }
    }
}

function finishDoorTransition(){

    currentDoor++;

    if(currentDoor >= 5){

        completeLevel();

    }else{

        loadDoor();
    }
}

function completeLevel(){

    document
    .getElementById("questionPanel")
    .classList.add("hidden");

    if(currentLevel === 4){

        finishGame(true);
        return;
    }

    document
    .getElementById("levelScreen")
    .classList.remove("hidden");

    document
    .getElementById("levelTitle")
    .textContent =
    `Level ${currentLevel+1} Complete!`;

    document
    .getElementById("levelMessage")
    .textContent =
    `You unlocked all five doors. Now enter Level ${currentLevel+2}.`;

    track(
        "level_complete",
        {
            level_number:currentLevel+1
        }
    );
}

function nextLevel(){

    currentLevel++;
    currentDoor = 0;

    document
    .getElementById("levelScreen")
    .classList.add("hidden");

    document
    .getElementById("questionPanel")
    .classList.remove("hidden");

    loadDoor();
}

function finishGame(win){

    document
    .getElementById("questionPanel")
    .classList.add("hidden");

    document
    .getElementById("levelScreen")
    .classList.add("hidden");

    document
    .getElementById("endScreen")
    .classList.remove("hidden");

    document
    .getElementById("endIcon")
    .textContent =
    win ? "🏆🤖🚪" : "💥🤖";

    document
    .getElementById("endTitle")
    .textContent =
    win ? "Emotion Lab Escaped!" : "Game Over";

    document
    .getElementById("endMessage")
    .textContent =
    win
    ? `You completed all 5 levels and unlocked all 25 doors! Final score: ${score}.`
    : `Robo ran out of lives at Level ${currentLevel+1}, Door ${currentDoor+1}. Final score: ${score}.`;

    track(
        "game_finish",
        {
            result:win ? "win" : "lose",
            score:score
        }
    );
}

</script>

/* =========================================================

const robot =

const white =

metalness:.55,

});


const dark =

});

});

emissive:0x1d4ed8,
emissiveIntensity:.8
});


const joints =
new THREE.MeshStandardMaterial({
color:0x475569,
metalness:.8,
roughness:.25
});



const robotParts = [];


function registerPart(
mesh,
name
){

mesh.userData.name =
name;


mesh.userData.homePosition =
mesh.position.clone();


mesh.userData.homeRotation =
mesh.rotation.clone();


robotParts.push(
mesh
);


return mesh;

}

registerPart(

new THREE.Mesh(

),

),

"body"

);

0;

),

/* =========================================================
   3D ANIMATION
========================================================= */

let emotion =
"normal";


let emotionStart =
0;


let exploding =
false;


const explosion =
[];



function resetRobot(){

exploding =
false;


emotion =
"normal";


robot.position.set(
0,
0,
0
);


robot.rotation.set(
0,
-.12,
0
);


robot.scale.set(
1,
1,
1
);


robotParts.forEach(
part => {

part.position.copy(
part.userData.homePosition
);


part.rotation.copy(
part.userData.homeRotation
);


part.visible =
true;

}
);


eyeLeft.scale.set(
1,
1.35,
1
);


eyeRight.scale.set(
1,
1.35,
1
);


mouth.scale.set(
1,
1,
1
);

}



/* EMOTION */

function playEmotion(
type
){

resetRobot();


emotion =
type;


emotionStart =
performance.now();

}



/* EXPLOSION */

function explodeRobot(){

resetRobot();


exploding =
true;


explosion.length =
0;


robotParts.forEach(
part => {


explosion.push({

part:part,

velocity:
new THREE.Vector3(

( Math.random() - .5 ) * .08,

Math.random() * .06 + .03,

( Math.random() - .5 ) * .05

),

rotation:
new THREE.Vector3(

Math.random() * .12,

Math.random() * .12,

Math.random() * .12

)

});


}
);

}



function updateEmotion(
time
){

if(
emotion ===
"normal"
)
return;


const t =
(
time -
emotionStart
)
/ 1000;



if(
emotion ===
"happy"
){

robot.position.y =
Math.abs(
Math.sin(
t * 8
)
)
*
.55;


robot.rotation.z =
Math.sin(
t * 9
)
*
.12;


armLeft.rotation.z =
-.7 -
Math.sin(
t * 7
)
*
.25;


armRight.rotation.z =
.7 +
Math.sin(
t * 7
)
*
.25;

}



if(
emotion ===
"angry"
){

robot.position.x =
Math.sin(
t * 35
)
*
.12;


robot.rotation.z =
Math.sin(
t * 30
)
*
.05;


eyeLeft.rotation.z =
-.35;


eyeRight.rotation.z =
.35;


mouth.rotation.z =
Math.PI;


blueLight.color.set(
0xff0000
);

}



if(
emotion ===
"afraid"
){

robot.position.x =
Math.sin(
t * 45
)
*
.07;


robot.position.y =
Math.sin(
t * 35
)
*
.05;


robot.scale.set(
.92,
.92,
.92
);

}



if(
emotion ===
"surprised"
){

const size =
1 +
Math.abs(
Math.sin(
t * 6
)
)
*
.22;


robot.scale.set(
size,
size,
size
);


eyeLeft.scale.set(
1.4,
1.8,
1.4
);


eyeRight.scale.set(
1.4,
1.8,
1.4
);


mouth.scale.set(
.45,
2.2,
1
);

}



if(
emotion ===
"sad"
){

robot.position.y =
-.18;


head.rotation.z =
-.12;


armLeft.rotation.z =
.25;


armRight.rotation.z =
-.25;


mouth.rotation.z =
Math.PI;

}



if(
emotion ===
"disgusted"
){

robot.rotation.z =
-.18;


head.rotation.y =
-.45;


blueLight.color.set(
0x22c55e
);

}



if(
emotion ===
"calm"
){

robot.position.y =
Math.sin(
t * 2
)
*
.04;


robot.rotation.z =
Math.sin(
t * 1.8
)
*
.02;

}



if(
emotion ===
"proud"
){

robot.position.y =
.1;


robot.rotation.y =
-.12 +
Math.sin(
t * 2
)
*
.15;


armLeft.rotation.z =
-.5;


armRight.rotation.z =
.5;


robot.scale.set(
1.08,
1.08,
1.08
);

}

}



/* EXPLOSION PHYSICS */

function updateExplosion(){

if(
!exploding
)
return;


explosion.forEach(
item => {


item.velocity.y -=
.0025;


item.part.position.add(
item.velocity
);


item.part.rotation.x +=
item.rotation.x;


item.part.rotation.y +=
item.rotation.y;


item.part.rotation.z +=
item.rotation.z;


}
);

}



/* =========================================================
   RENDER LOOP
========================================================= */

function resizeRenderer(){

const box =
canvas.getBoundingClientRect();


renderer.setSize(
box.width,
box.height,
false
);


camera.aspect =
box.width /
box.height;


camera.updateProjectionMatrix();

}



function animate(
time
){

requestAnimationFrame(
animate
);


resizeRenderer();


if(
!exploding
){

updateEmotion(
time
);

}


updateExplosion();


robot.rotation.y +=
0.001;


renderer.render(
scene,
camera
);

}


requestAnimationFrame(
animate
);



/* =========================================================
   GAME FUNCTIONS
========================================================= */

function track(
name,
parameters={}
){

if(
typeof gtag ===
"function"
){

gtag(
"event",
name,
parameters
);

}

}



function startGame(){

currentLevel =
0;


currentDoor =
0;


score =
0;


lives =
3;


locked =
false;


document
.getElementById(
"startScreen"
)
.classList
.add(
"hidden"
);


document
.getElementById(
"endScreen"
)
.classList
.add(
"hidden"
);


document
.getElementById(
"levelCompleteScreen"
)
.classList
.add(
"hidden"
);


document
.getElementById(
"gameScreen"
)
.classList
.remove(
"hidden"
);


track(
"game_start"
);


renderDoor();

}



function renderDoor(){

locked =
false;


resetRobot();


blueLight.color.set(
0x22d3ee
);


const level =
levels[
currentLevel
];


const item =
level.questions[
currentDoor
];


document
.getElementById(
"levelLabel"
)
.textContent =
`Level ${currentLevel + 1}`;


document
.getElementById(
"doorLabel"
)
.textContent =
`Door ${currentDoor + 1}/5`;


document
.getElementById(
"scoreLabel"
)
.textContent =
`Score: ${score}`;


document
.getElementById(
"livesLabel"
)
.textContent =
"❤️".repeat(
lives
)
+
"🖤".repeat(
3-lives
);


document
.getElementById(
"question"
)
.textContent =
item.q;


document
.getElementById(
"feedback"
)
.textContent =
"";


const choices =
document
.getElementById(
"choices"
);


choices.innerHTML =
"";


item.answers.forEach(
(answer,index) => {


const button =
document.createElement(
"button"
);


button.textContent =
answer;


button.onclick =
() =>
answerQuestion(
index
);


choices.appendChild(
button
);


}
);

}



function disableButtons(
value
){

document
.querySelectorAll(
"#choices button"
)
.forEach(
button =>
button.disabled =
value
);

}



function answerQuestion(
index
){

if(
locked
)
return;


locked =
true;


disableButtons(
true
);


const item =
levels[
currentLevel
]
.questions[
currentDoor
];


const feedback =
document
.getElementById(
"feedback"
);


if(
index ===
item.correct
){

score +=
100;


playEmotion(
item.emotion
);


feedback.textContent =
"✅ Correct!";


track(
"door_complete",
{

level_number:
currentLevel + 1,

door_number:
currentDoor + 1,

emotion:
item.emotion

}
);


document
.getElementById(
"scoreLabel"
)
.textContent =
`Score: ${score}`;


setTimeout(
() => {


blueLight.color.set(
0x22d3ee
);


currentDoor++;


if(
currentDoor >=
5
){

levelFinished();

}

else{

renderDoor();

}


},
1800
);

}


else
{

lives--;


feedback.textContent =
"💥 Wrong answer! Robo broke apart!";


document
.getElementById(
"livesLabel"
)
.textContent =
"❤️".repeat(
lives
)
+
"🖤".repeat(
3-lives
);


explodeRobot();


track(
"wrong_answer",
{

level_number:
currentLevel + 1,

door_number:
currentDoor + 1

}
);


if(
lives <=
0
){

setTimeout(
() =>
finishGame(
false
),
1900
);

}

else
{

setTimeout(
() => {


resetRobot();


feedback.textContent =
"🔧 Robo rebuilt himself. Try again!";


disableButtons(
false
);


locked =
false;


},
1800
);

}

}

}



function levelFinished(){

document
.getElementById(
"gameScreen"
)
.classList
.add(
"hidden"
);


if(
currentLevel ===
levels.length - 1
){

finishGame(
true
);


return;

}


document
.getElementById(
"levelCompleteScreen"
)
.classList
.remove(
"hidden"
);


document
.getElementById(
"levelCompleteTitle"
)
.textContent =
`Level ${currentLevel + 1} Complete!`;


document
.getElementById(
"levelCompleteText"
)
.textContent =
`You unlocked all five doors in ${levels[currentLevel].name}. Now continue to Level ${currentLevel + 2}!`;


track(
"level_complete",
{

level_number:
currentLevel + 1

}
);

}



function nextLevel(){

currentLevel++;


currentDoor =
0;


document
.getElementById(
"levelCompleteScreen"
)
.classList
.add(
"hidden"
);


document
.getElementById(
"gameScreen"
)
.classList
.remove(
"hidden"
);


renderDoor();

}



function finishGame(
win
){

document
.getElementById(
"gameScreen"
)
.classList
.add(
"hidden"
);


document
.getElementById(
"levelCompleteScreen"
)
.classList
.add(
"hidden"
);


document
.getElementById(
"endScreen"
)
.classList
.remove(
"hidden"
);


document
.getElementById(
"endIcon"
)
.textContent =
win
?
"🏆🤖🚪"
:
"💥🤖";


document
.getElementById(
"endTitle"
)
.textContent =
win
?
"Emotion Lab Escaped!"
:
"Game Over";


document
.getElementById(
"endText"
)
.textContent =
win
?
`Amazing! You completed all 5 levels and unlocked all 25 doors. Final score: ${score}.`
:
`Robo ran out of lives at Level ${currentLevel + 1}, Door ${currentDoor + 1}. Final score: ${score}.`;


track(
"game_finish",
{

result:
win
?
"win"
:
"lose",

score:
score

}
);

}


</script>

</body>
</html>

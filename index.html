let currentLevel =
0;


let currentDoor =
0;


let score =
0;


let lives =
3;


let locked =
false;



const startScreen =
document
.getElementById(
"startScreen"
);


const gameScreen =
document
.getElementById(
"gameScreen"
);


const levelCompleteScreen =
document
.getElementById(
"levelCompleteScreen"
);


const endScreen =
document
.getElementById(
"endScreen"
);



function safeTrack(
eventName,
params = {}
) {


if (
typeof gtag ===
"function"
) {


gtag(
"event",
eventName,
params
);


}


}



function startGame() {


currentLevel =
0;


currentDoor =
0;


score =
0;


lives =
3;


locked =
false;



startScreen
.classList
.add(
"hidden"
);



levelCompleteScreen
.classList
.add(
"hidden"
);



endScreen
.classList
.add(
"hidden"
);



gameScreen
.classList
.remove(
"hidden"
);



safeTrack(
"game_start"
);



renderDoor();


}



function resetRobot() {


const robot =
document
.getElementById(
"robot"
);



robot.className =
"robot-wrap";



const parts =
robot
.querySelectorAll(
".robot-part"
);



parts.forEach(
part => {


part.style.opacity =
"";


part.style.transform =
"";


}
);



void robot.offsetWidth;


}



function setEmotion(
emotion
) {


const robot =
document
.getElementById(
"robot"
);



robot
.classList
.add(
emotion
);


}



function animateCorrect(
emotion
) {


const robot =
document
.getElementById(
"robot"
);



resetRobot();



setEmotion(
emotion
);



const supported =
[
"happy",
"angry",
"afraid",
"disgusted",
"surprised",
"sad",
"calm",
"proud"
];



const name =
supported.includes(
emotion
)
?
emotion
:
"happy";



robot
.classList
.add(
"anim-" + name
);


}



function breakRobot() {


const robot =
document
.getElementById(
"robot"
);



resetRobot();



void robot.offsetWidth;



robot
.classList
.add(
"breaking"
);


}



function renderDoor() {


locked =
false;



resetRobot();



const level =
levels[
currentLevel
];



const item =
level.questions[
currentDoor
];



document
.getElementById(
"levelLabel"
)
.textContent =
`Level ${currentLevel + 1}`;



document
.getElementById(
"doorLabel"
)
.textContent =
`Door ${currentDoor + 1}/5`;



document
.getElementById(
"scoreLabel"
)
.textContent =
`Score: ${score}`;



document
.getElementById(
"livesLabel"
)
.textContent =

"❤️".repeat(
lives
)

+

"🖤".repeat(
3 - lives
);



document
.getElementById(
"question"
)
.textContent =
item.q;



document
.getElementById(
"feedback"
)
.textContent =
"";



const choices =
document
.getElementById(
"choices"
);



choices.innerHTML =
"";



item.answers.forEach(
(answer,index) => {


const button =
document
.createElement(
"button"
);



button.textContent =
answer;



button.onclick =
() =>
chooseAnswer(
index
);



choices.appendChild(
button
);


}
);


}



function setButtonsDisabled(
disabled
) {


document
.querySelectorAll(
"#choices button"
)
.forEach(
button => {


button.disabled =
disabled;


}
);


}



function chooseAnswer(
index
) {


if (
locked
)
return;



locked =
true;



setButtonsDisabled(
true
);



const level =
levels[
currentLevel
];



const item =
level.questions[
currentDoor
];



const feedback =
document
.getElementById(
"feedback"
);



if (
index ===
item.correct
) {


score +=
100;



animateCorrect(
item.emotion
);



feedback.textContent =
"✅ " +
item.good;



safeTrack(
"door_complete",
{

level_number:
currentLevel + 1,

door_number:
currentDoor + 1,

emotion:
item.emotion

}
);



document
.getElementById(
"scoreLabel"
)
.textContent =
`Score: ${score}`;



setTimeout(
() => {


currentDoor++;



if (
currentDoor >=
5
) {


showLevelComplete();


}


else {


renderDoor();


}


},
1500
);


}



else {


lives--;



feedback.textContent =
"💥 Wrong answer! Robo fell apart!";



document
.getElementById(
"livesLabel"
)
.textContent =

"❤️".repeat(
lives
)

+

"🖤".repeat(
3 - lives
);



safeTrack(
"wrong_answer",
{

level_number:
currentLevel + 1,

door_number:
currentDoor + 1

}
);



breakRobot();



if (
lives <=
0
) {


setTimeout(
() =>
finishGame(
false
),
1600
);


}


else {


setTimeout(
() => {


resetRobot();



feedback.textContent =
"🔧 Robo rebuilt himself. Try again!";



setButtonsDisabled(
false
);



locked =
false;


},
1500
);


}


}


}



function showLevelComplete() {


gameScreen
.classList
.add(
"hidden"
);



if (
currentLevel ===
levels.length - 1
) {


finishGame(
true
);


return;


}



levelCompleteScreen
.classList
.remove(
"hidden"
);



document
.getElementById(
"levelCompleteTitle"
)
.textContent =
`Level ${currentLevel + 1} Complete!`;



document
.getElementById(
"levelCompleteText"
)
.textContent =
`You unlocked all 5 doors in "${levels[currentLevel].name}". Now go to the next level!`;



safeTrack(
"level_complete",
{

level_number:
currentLevel + 1

}
);


}



function nextLevel() {


levelCompleteScreen
.classList
.add(
"hidden"
);



currentLevel++;



currentDoor =
0;



gameScreen
.classList
.remove(
"hidden"
);



renderDoor();


}



function finishGame(
win
) {


gameScreen
.classList
.add(
"hidden"
);



levelCompleteScreen
.classList
.add(
"hidden"
);



endScreen
.classList
.remove(
"hidden"
);



document
.getElementById(
"endIcon"
)
.textContent =
win
?
"🏆🤖🚪"
:
"🔒💥🤖";



document
.getElementById(
"endTitle"
)
.textContent =
win
?
"Emotion Lab Escaped!"
:
"Game Over";



document
.getElementById(
"endText"
)
.textContent =
win
?
`Amazing! You completed all 5 levels, unlocked all 25 doors, and scored ${score} points!`
:
`Robo ran out of lives at Level ${currentLevel + 1}, Door ${currentDoor + 1}. Your score was ${score}. Try again!`;



safeTrack(
"game_finish",
{

result:
win
?
"win"
:
"lose",

final_score:
score,

level_reached:
currentLevel + 1,

door_reached:
currentDoor + 1

}
);


}
